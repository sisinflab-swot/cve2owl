[project]
name = "cve2owl"
authors = [
    { name = "Ivano Bilenchi", email = "ivano.bilenchi@poliba.it" },
    { name = "Arnaldo Tomasino", email = "arnaldo.tomasino@poliba.it" },
    { name = "Vincenzo Gentile", email = "v.gentile2@studenti.poliba.it" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = ["pycowl == 0.1.2", "psutil"]
version = "0.1.0"

[project.scripts]
cve2owl = "cve2owl.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "BLE001",  # blind-except
    "CPY001",  # missing-copyright-notice
    "D",       # docstrings
    "N806",    # non-lowercase-variable-in-function
    "PD",      # pandas
    "PLC0414", # useless-import-alias
    "PLR09",   # too-many-*
    "PLR2004", # magic-value-comparison
    "PYI021",  # docstring-in-stub
    "S310",    # suspicious-url-open-usage
    "T201",    # print
]
isort.combine-as-imports = true

[tool.ruff.format]
preview = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
